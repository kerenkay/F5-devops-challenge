services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).close()"]
      interval: 2s
      timeout: 3s
      start_period: 15s
      retries: 10

  proxy:
    build:
      context: ./proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8081:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "2", "http://127.0.0.1:8080/nginx-health"]
      interval: 2s
      timeout: 3s
      retries: 10

  test-runner:
    build:
      context: ./test-runner
    depends_on:
      proxy:
        condition: service_healthy
    environment:
      - PROXY_URL=http://proxy:8080
